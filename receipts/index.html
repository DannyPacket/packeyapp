<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Receipt Splitter</title>
<style>[hidden]{display:none!important}body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#16202b; --muted:#5f6b78; --line:#d6dce3; --band:#f1f4f7;
  --me:#0f7c74; --me-soft:#d7efec;
  --rm:#c2481f; --rm-soft:#f8e1d7;
  --sh:#5847b8; --sh-soft:#e5e1f7;
  --focus:#2f6fe0;
  --p0:#0f7c74;--p0-soft:#d7efec;--p1:#c2481f;--p1-soft:#f8e1d7;--p2:#5847b8;--p2-soft:#e5e1f7;--p3:#9a6a00;--p3-soft:#f6ead0;--p4:#1f64b8;--p4-soft:#dde9f8;--p5:#b0306a;--p5-soft:#f7dde8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151b; --paper:#18202a; --ink:#e7ecf1; --muted:#98a4b1; --line:#2c3643; --band:#1e2833;
    --me:#4fc6bb; --me-soft:#123a37; --rm:#f08a63; --rm-soft:#43241a; --sh:#a597f5; --sh-soft:#2b2550; --focus:#7aa7ff;
    --p0:#4fc6bb;--p0-soft:#123a37;--p1:#f08a63;--p1-soft:#43241a;--p2:#a597f5;--p2-soft:#2b2550;--p3:#e0b04a;--p3-soft:#3b2e10;--p4:#7fb0f0;--p4-soft:#15294a;--p5:#ee86b4;--p5-soft:#46182e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151b; --paper:#18202a; --ink:#e7ecf1; --muted:#98a4b1; --line:#2c3643; --band:#1e2833;
  --me:#4fc6bb; --me-soft:#123a37; --rm:#f08a63; --rm-soft:#43241a; --sh:#a597f5; --sh-soft:#2b2550; --focus:#7aa7ff;
  --p0:#4fc6bb;--p0-soft:#123a37;--p1:#f08a63;--p1-soft:#43241a;--p2:#a597f5;--p2-soft:#2b2550;--p3:#e0b04a;--p3-soft:#3b2e10;--p4:#7fb0f0;--p4-soft:#15294a;--p5:#ee86b4;--p5-soft:#46182e;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:28px 60px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:20px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;letter-spacing:-.02em}
.back{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.sub{color:var(--muted);margin:4px 0 0}
.mono,.amt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.names{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.plist{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--paper);border-radius:6px}
.pchip input{width:110px;border:0;background:transparent;padding:4px 8px;color:var(--ink)}
.px{border:0;background:none;color:var(--muted);font-size:12px;padding:0 8px}
.padd{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--ink)}

.drop{border:2px dashed var(--line);border-radius:10px;background:var(--paper);padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;transition:border-color .15s}
.drop.over{border-color:var(--sh)}
.drop textarea{flex-basis:100%;width:100%;font:12px/1.45 "IBM Plex Mono",ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical;white-space:pre;overflow-x:auto}
.drop .or{color:var(--muted);font-size:13px}
.drop small{color:var(--muted)}
.qty{font-size:12px;color:var(--muted);margin-left:6px}
.tx{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.splitq{border:0;background:none;color:var(--sh);font-size:12px;text-decoration:underline;padding:0 4px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--rm)}

.receipt{background:var(--paper);border-radius:4px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.35);padding:18px 18px 8px;position:relative}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--paper) 0) 0 0/12px 8px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:6px;flex-wrap:wrap}
.store{font-family:"IBM Plex Mono",monospace;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bulk{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.bulk .seg button,.cat .seg button{padding:2px 10px;font-size:12px}

.cat{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--band);margin:14px -18px 0;padding:8px 18px;border-block:1px solid var(--line)}
.cat:first-child{margin-top:4px}
.cat h3{margin:0;font:600 12px/1.3 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em}
.cat h3 .meta{font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:8px}
.cat .seg{grid-column:auto}
.cat .lbl{font-size:12px;color:var(--muted)}

.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-bottom:1px dotted var(--line);align-items:center}
.item .name{font-family:"IBM Plex Mono",monospace;font-size:14px;overflow-wrap:anywhere}
.item .amt{text-align:right}
.item .del{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px}
.seg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--c);border-color:var(--c)}
.seg button.all{border-style:dashed}
.seg button.all[aria-pressed="true"]{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.seg .each{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.item.unset .name::before{content:"• ";color:var(--rm)}

.add{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}
.add input{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 10px}
.add #newName{flex:1;min-width:140px}
.add #newAmt{width:100px}

.extras{border-top:1px dashed var(--line);margin-top:4px;padding:10px 0 14px;display:grid;gap:6px}
.extras label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.extras input{width:100px;text-align:right;border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 8px}
.extras .tot{display:flex;justify-content:space-between;font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin:0}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.person{border-radius:10px;padding:16px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--c)}
.person h2{margin:0 0 8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:18px;color:var(--c)}
.person .big{font-family:"IBM Plex Mono",monospace;font-size:32px;font-weight:600;line-height:1.1}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.rows{display:grid;gap:2px;margin-top:10px}
.person details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.person summary{font-size:13px;cursor:pointer;color:var(--ink)}
.person details .rows{margin-top:6px}
.warn{font-size:13px;color:var(--rm);margin:0}
.copy{justify-self:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back" href="../living-situations/index.html">← Packey</a>
    <h1>Receipt Splitter</h1>
    <p class="sub">Drop a receipt, tag each line, and see who owes what. Tap one name for a personal item, or several to split it between them. Tax and tip follow the items.</p>
  </header>

  <div class="names"><span>Splitting between</span><span id="people" class="plist"></span></div>

  <div class="drop" id="drop">
    <label for="paste" style="flex-basis:100%"><strong>Paste receipt text</strong><br><small>Paste the itemized text from your store receipt. It handles store sections, savings, "price you pay", weighed items and tax.</small></label>
    <textarea id="paste" rows="6" spellcheck="false" placeholder="DAIRY&#10;        SB VNL YGRT 32Z         4.49 F&#10;        SAVINGS                 0.50-F&#10;   PRICE YOU PAY           3.99&#10;        TAX                     1.87"></textarea>
    <button class="btn" id="load">Load items</button>
    <button class="btn ghost" id="tidy" hidden>Clean up names</button>
    <span class="or">or</span>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="btn ghost" id="pick">Use a photo</button>
    <button class="btn ghost" id="clear">Start blank</button>
    <div class="status" id="status" style="flex-basis:100%"></div>
  </div>

  <section class="receipt" aria-label="Receipt items">
    <div class="rhead">
      <span class="store" id="store">Example receipt</span>
      <span class="bulk">All unassigned → <span id="bulk" class="seg"></span></span>
    </div>
    <div id="items"></div>
    <form class="add" id="addForm">
      <input id="newName" placeholder="Add an item" aria-label="Item name">
      <input id="newAmt" placeholder="0.00" inputmode="decimal" aria-label="Item price">
      <button class="btn ghost" type="submit">Add</button>
    </form>
    <div class="extras">
      <label>Tax <input id="tax" class="mono" inputmode="decimal"></label>
      <label>Tip / fees <input id="tip" class="mono" inputmode="decimal"></label>
      <label>Discounts (enter as positive) <input id="disc" class="mono" inputmode="decimal"></label>
      <div class="tot"><span>Receipt total</span><span class="amt" id="grand"></span></div>
      <p class="note" id="printed"></p>
    </div>
  </section>

  <p class="warn" id="unsetWarn" hidden></p>
  <section class="split" id="split"></section>
  <button class="btn ghost copy" id="copy">Copy summary</button>
</div>

<script>
const $ = s => document.querySelector(s);
const money = n => (n<0?"-":"") + "$" + Math.abs(n).toFixed(2);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };

const PALETTE = 6;
const LEGACY = {me:["p1"], rm:["p2"], sh:["p1","p2"]};
const OTHER = "Other items";

const EXAMPLE = {store:"Example receipt", items:[
  {name:"Oat milk 64oz", price:4.99, cat:"Dairy", who:["p1","p2"]},
  {name:"Greek yogurt 4pk", price:5.29, cat:"Dairy", who:["p2"]},
  {name:"Chicken thighs", price:11.48, cat:"Meat", who:["p1"]},
  {name:"Paper towels 6ct", price:9.99, cat:"Grocery", tax:true, who:["p1","p2"]},
  {name:"Protein bars", price:12.99, cat:"Grocery", who:[]},
], tax:0.62, tip:0, disc:0, printedTotal:null};

let state, people;
try { state = JSON.parse(localStorage.getItem("rsplit")) } catch(e) {}
if (!state || !Array.isArray(state.items)) state = structuredClone(EXAMPLE);
try { people = JSON.parse(localStorage.getItem("rsplit-people")) } catch(e) {}
if (!Array.isArray(people) || people.length < 2) {
  people = [{id:"p1", name:"Me"}, {id:"p2", name:"Roommate"}];
  try { const n = JSON.parse(localStorage.getItem("rsplit-names")); if (n) { people[0].name = n.me || "Me"; people[1].name = n.rm || "Roommate"; } } catch(e) {}
}

const nameOf = p => p.name.trim() || "Person " + (people.indexOf(p) + 1);
const colorOf = id => { const i = people.findIndex(p => p.id === id) % PALETTE; return {c:`var(--p${i})`, soft:`var(--p${i}-soft)`}; };
const catTitle = s => s.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\b(And|Of|The)\b/g, w => w.toLowerCase());
const hasCats = () => state.items.some(it => it.cat);
// items from older versions and from the parsers may carry who as null or "me"/"rm"/"sh"
function normalize(){
  const ids = new Set(people.map(p => p.id));
  state.items.forEach(it => {
    if (!Array.isArray(it.who)) it.who = LEGACY[it.who] ? [...LEGACY[it.who]] : [];
    it.who = it.who.filter(id => ids.has(id));
  });
}
function save(){ try{ localStorage.setItem("rsplit", JSON.stringify(state)); localStorage.setItem("rsplit-people", JSON.stringify(people)); }catch(e){} }

function renderPeople(){
  const box = $("#people"); box.innerHTML = "";
  people.forEach((p, i) => {
    const chip = document.createElement("span"); chip.className = "pchip"; chip.style.setProperty("--c", colorOf(p.id).c);
    const inp = document.createElement("input"); inp.id = "name-" + p.id; inp.value = p.name; inp.placeholder = "Name"; inp.setAttribute("aria-label", `Person ${i+1} name`);
    inp.oninput = () => { p.name = inp.value; renderItems(); renderSplit(); save(); };
    chip.append(inp);
    if (people.length > 2) {
      const x = document.createElement("button"); x.type = "button"; x.className = "px"; x.textContent = "✕"; x.setAttribute("aria-label", `Remove ${nameOf(p)}`);
      x.onclick = () => { people.splice(i, 1); update(); renderPeople(); };
      chip.append(x);
    }
    box.append(chip);
  });
  const add = document.createElement("button"); add.type = "button"; add.className = "padd"; add.textContent = "+ Add person";
  add.onclick = () => {
    const id = "p" + (Math.max(0, ...people.map(p => +p.id.slice(1) || 0)) + 1);
    people.push({id, name:""}); update(); renderPeople(); $("#name-" + id).focus();
  };
  box.append(add);
}

function whoButtons(current, onPick){
  const frag = document.createDocumentFragment();
  people.forEach(p => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = nameOf(p);
    const col = colorOf(p.id); b.style.setProperty("--c", col.c); b.style.setProperty("--soft", col.soft);
    if (current) b.setAttribute("aria-pressed", String(current.includes(p.id)));
    b.onclick = () => onPick([p.id], p.id);
    frag.append(b);
  });
  const all = document.createElement("button"); all.type = "button"; all.textContent = people.length === 2 ? "Shared" : "Everyone";
  all.className = "all";
  if (current) all.setAttribute("aria-pressed", String(current.length === people.length));
  all.onclick = () => onPick(people.map(p => p.id), null);
  frag.append(all);
  return frag;
}

// sections in the order the receipt lists them; items keep their index in state.items
function groups(){
  const order = [], by = {};
  state.items.forEach((it, i) => {
    const k = hasCats() ? (it.cat || OTHER) : "";
    if (!by[k]) { by[k] = []; order.push(k); }
    by[k].push(i);
  });
  return order.map(k => ({cat:k, idx:by[k]}));
}

function itemRow(it, i){
  const row = document.createElement("div");
  row.className = "item" + (it.who.length ? "" : " unset");
  const nm = document.createElement("span"); nm.className="name"; nm.textContent = it.name;
  if (it.units && it.units.length > 1) {
    const q = document.createElement("span"); q.className="qty"; q.textContent = "×" + it.units.length;
    const sp = document.createElement("button"); sp.className="splitq"; sp.type="button"; sp.textContent="split";
    sp.setAttribute("aria-label", "Split into separate lines");
    sp.onclick = () => { state.items.splice(i, 1, ...it.units.map(p => ({name:it.name, price:p, tax:it.tax, cat:it.cat, who:[...it.who]}))); update(); };
    nm.append(q, sp);
  }
  if (it.tax) { const t = document.createElement("span"); t.className="tx"; t.title="Taxable"; t.textContent="T"; nm.append(t); }
  const right = document.createElement("span"); right.className="amt";
  right.innerHTML = `${money(it.price)} <button class="del" aria-label="Remove item">✕</button>`;
  right.querySelector(".del").onclick = () => { state.items.splice(i,1); update(); };
  const seg = document.createElement("div"); seg.className="seg"; seg.setAttribute("role","group");
  // tapping a name toggles that person in or out, so any group can split an item; Everyone selects all
  seg.append(whoButtons(it.who, (ids, one) => {
    if (one) it.who = it.who.includes(one) ? it.who.filter(x => x !== one) : [...it.who, one];
    else it.who = it.who.length === people.length ? [] : ids;
    update();
  }));
  if (it.who.length > 1) {
    const note = document.createElement("span"); note.className = "each"; note.textContent = `${money(it.price / it.who.length)} each`;
    seg.append(note);
  }
  row.append(nm, right, seg);
  return row;
}

function renderItems(){
  const box = $("#items");
  box.innerHTML = "";
  $("#store").textContent = state.store || "Receipt";
  groups().forEach(g => {
    if (g.cat) {
      const items = g.idx.map(i => state.items[i]);
      const head = document.createElement("div"); head.className = "cat";
      const h = document.createElement("h3"); h.textContent = g.cat;
      const meta = document.createElement("span"); meta.className = "meta";
      meta.textContent = `${items.length} item${items.length>1?"s":""} · ${money(items.reduce((s,it)=>s+it.price,0))}`;
      h.append(meta);
      // one tap assigns the whole section, e.g. all of Health and Beauty to one person
      const seg = document.createElement("span"); seg.className = "seg";
      const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Whole section →";
      seg.append(lbl, whoButtons(null, ids => { items.forEach(it => it.who = [...ids]); update(); }));
      head.append(h, seg);
      box.append(head);
    }
    g.idx.forEach(i => box.append(itemRow(state.items[i], i)));
  });
  const bulk = $("#bulk"); bulk.innerHTML = "";
  bulk.append(whoButtons(null, ids => { state.items.forEach(it => { if (!it.who.length) it.who = [...ids]; }); update(); }));
  $("#tax").value = state.tax ? state.tax.toFixed(2) : "";
  $("#tip").value = state.tip ? state.tip.toFixed(2) : "";
  $("#disc").value = state.disc ? state.disc.toFixed(2) : "";
}

function compute(){
  const sub = state.items.reduce((s, it) => s + it.price, 0);
  const taxBase = state.items.reduce((s, it) => s + (it.tax ? it.price : 0), 0);
  const tax = state.tax||0, other = (state.tip||0) - (state.disc||0);
  const per = Object.fromEntries(people.map(p => [p.id, {own:0, split:0, total:0, cats:{}}]));
  let unSum = 0;
  // tax lands on taxable (T) items when the receipt marks them; tip and discounts spread by price
  state.items.forEach(it => {
    const taxShare = taxBase > 0 ? (it.tax ? it.price / taxBase * tax : 0) : (sub ? it.price / sub * tax : 0);
    const full = it.price + taxShare + (sub ? it.price / sub * other : 0);
    if (!it.who.length) { unSum += it.price; return; }
    const cat = it.cat || OTHER;
    it.who.forEach(id => {
      const r = per[id]; if (!r) return;
      if (it.who.length === 1) r.own += it.price; else r.split += it.price / it.who.length;
      r.total += full / it.who.length;
      r.cats[cat] = (r.cats[cat] || 0) + it.price / it.who.length;
    });
  });
  return {sub, unSum, grand: sub + tax + other, per};
}

function renderSplit(){
  const c = compute(), order = groups().map(g => g.cat || OTHER);
  $("#grand").textContent = money(c.grand);
  const p = state.printedTotal;
  $("#printed").textContent = p!=null && Math.abs(p - c.grand) > 0.01
    ? `Printed total was ${money(p)} — ${money(c.grand - p)} off. Check the items, tax, or discounts.` : (p!=null ? `Matches the printed total of ${money(p)}.` : "");
  const open = new Set([...document.querySelectorAll(".person details[open]")].map(d => d.dataset.id));
  $("#split").innerHTML = people.map(pp => { const r = c.per[pp.id];
    const cats = order.filter(k => r.cats[k] > 0.004);
    const byCat = hasCats() && cats.length ? `<details data-id="${pp.id}"${open.has(pp.id)?" open":""}><summary>By section</summary><div class="rows">${
      cats.map(k => `<div class="row"><span>${escapeHtml(k)}</span><span class="amt">${money(r.cats[k])}</span></div>`).join("")}</div></details>` : "";
    return `<article class="person" style="--c:${colorOf(pp.id).c}"><h2>${escapeHtml(nameOf(pp))}</h2>
    <div class="big">${money(r.total)}</div>
    <div class="rows"><div class="row"><span>Own items</span><span class="amt">${money(r.own)}</span></div>
    <div class="row"><span>Share of split items</span><span class="amt">${money(r.split)}</span></div>
    <div class="row"><span>Tax / tip / discounts</span><span class="amt">${money(r.total - r.own - r.split)}</span></div></div>${byCat}</article>`; }).join("");
  const un = state.items.filter(i => !i.who.length).length;
  $("#unsetWarn").hidden = !un;
  $("#unsetWarn").textContent = `${un} item${un>1?"s":""} not assigned yet (${money(c.unSum)}) — not counted in anyone's total.`;
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function update(){ normalize(); renderItems(); renderSplit(); save(); }

["tax","tip","disc"].forEach(k => $("#"+k).addEventListener("change", e => { state[k] = num(e.target.value); update(); }));
$("#addForm").addEventListener("submit", e => { e.preventDefault();
  const n = $("#newName").value.trim(), a = num($("#newAmt").value);
  if (!n || !a) return;
  state.items.push({name:n, price:a, cat: hasCats() ? "Added by hand" : undefined, who:[]}); $("#newName").value=""; $("#newAmt").value=""; update(); $("#newName").focus(); });
$("#clear").onclick = () => { state = {store:"Receipt", items:[], tax:0, tip:0, disc:0, printedTotal:null}; setStatus(""); update(); };

$("#copy").onclick = async () => {
  const c = compute();
  const txt = `${state.store||"Receipt"} — ${money(c.grand)}\n` + people.map(p => `${nameOf(p)}: ${money(c.per[p.id].total)}`).join("\n");
  try { await navigator.clipboard.writeText(txt); $("#copy").textContent="Copied"; setTimeout(()=>$("#copy").textContent="Copy summary",1500); }
  catch(e){ setStatus(txt.replace(/\n/g," · ")); }
};

// Pasted receipt text (grocery register format: section headings, NAME  4.99 F, SAVINGS 0.50-F, PRICE YOU PAY, TAX, BALANCE)
function parseReceipt(text){
  const out = {store:"Receipt", items:[], tax:0, tip:0, disc:0, printedTotal:null};
  let last = null, detail = "", cat;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\*+/g, "").trim();
    if (!line) continue;
    let m;
    if (/^total after savings|^subtotal/i.test(line)) continue;
    if ((m = line.match(/^(?:sales\s+)?tax\b.*?(-?\d+\.\d{2})\s*$/i))) { out.tax += num(m[1]); continue; }
    if ((m = line.match(/^(?:balance|total|amount due)\b.*?(\d+\.\d{2})\s*$/i))) { out.printedTotal = num(m[1]); continue; }
    if ((m = line.match(/^(?:savings|coupon|discount|you saved)\b.*?(\d+\.\d{2})-/i))) { if (last) last.price -= num(m[1]); else out.disc += num(m[1]); continue; }
    if ((m = line.match(/^price you pay\s+(\d+\.\d{2})/i))) { if (last) last.price = num(m[1]); continue; }
    if (line.includes("@")) { if (!line.includes("=")) detail = line; continue; }
    // a line of only capital words with no price is a store section, e.g. "BAKE SHOP" or "SEAFOOD / FISH"
    if (/^[A-Z][A-Z &\/\-',.]*[A-Z]$/.test(line) && !/^WT$/.test(line)) { cat = catTitle(line); last = null; continue; }
    if ((m = line.match(/^(?:WT\s+)?\+?(.+?)\s{2,}(\d+\.\d{2})(-?)\s*([A-Z]{1,2})?$/))) {
      let name = m[1].trim(), price = num(m[2]);
      if (m[3]) { if (last) last.price -= price; continue; }
      const wt = detail.match(/([\d.]+)\s*lb/i), q = detail.match(/^(\d+)\s*@/);
      if (wt) name += ` (${wt[1]} lb)`; else if (q) name += ` ×${q[1]}`;
      last = {name, price, tax: m[4] === "T", cat, who:[]};
      out.items.push(last); detail = "";
    }
  }
  // merge repeated lines of the same product into one row; "split" breaks them back out
  const merged = [], byKey = {};
  for (const it of out.items) {
    it.price = Math.round(it.price * 100) / 100;
    const k = it.name + "|" + it.tax + "|" + it.cat;
    if (byKey[k]) { byKey[k].units.push(it.price); byKey[k].price = Math.round((byKey[k].price + it.price) * 100) / 100; }
    else { byKey[k] = {...it, units:[it.price]}; merged.push(byKey[k]); }
  }
  out.items = merged;
  return out;
}

$("#load").onclick = () => {
  const text = $("#paste").value;
  if (!text.trim()) { setStatus("Paste the receipt text into the box first.", true); return; }
  const r = parseReceipt(text);
  if (!r.items.length) { setStatus("No items found. Each item line should end with a price, like “EGGS 18CT   4.19 F”.", true); return; }
  state = r;
  const c = compute(), nCats = new Set(r.items.map(i => i.cat).filter(Boolean)).size;
  setStatus(`Loaded ${r.items.reduce((s,i)=>s+i.units.length,0)} lines as ${r.items.length} items` + (nCats ? ` in ${nCats} sections.` : ".") +
    (r.printedTotal != null ? (Math.abs(c.grand - r.printedTotal) < 0.01 ? ` Matches the ${money(r.printedTotal)} balance.` : ` Adds up to ${money(c.grand)} but the receipt says ${money(r.printedTotal)} — check the list.`) : ""));
  $("#tidy").hidden = !sample;
  update();
};

$("#tidy").onclick = async () => {
  if (!sample || !state.items.length) return;
  $("#tidy").disabled = true; setStatus("Cleaning up names…");
  try {
    const names = state.items.map(i => i.name);
    const res = await sample.json(`These are abbreviated grocery receipt item names, in order. Rewrite each as a short, readable product name in sentence case (e.g. "SB VNL YGRT 32Z" -> "Vanilla yogurt 32 oz", "NP ORG BBY SPNC" -> "Organic baby spinach"). Keep any "(x lb)" or "×n" suffix. Reply with only a JSON array of ${names.length} strings in the same order.\n\n${JSON.stringify(names)}`, {modelTier:"quick"});
    if (!Array.isArray(res) || res.length !== names.length) throw {code:"invalid_json"};
    state.items.forEach((it, i) => { if (res[i]) it.name = String(res[i]); });
    setStatus("Names cleaned up."); update();
  } catch(e) {
    setStatus(e && e.code === "not_granted" ? "Claude access was declined, so names stay as printed." : "Couldn't clean up the names. The originals are unchanged.", true);
  } finally { $("#tidy").disabled = false; }
};

function setStatus(msg, err){ const s=$("#status"); s.textContent=msg; s.classList.toggle("err", !!err); }

// Receipt reading via Claude
let sample = null;
const PROMPT = `This image is a store or restaurant receipt. Extract every purchased line item.
Reply with only JSON of this shape:
{"store": string, "items": [{"name": string, "price": number, "category": string|null, "taxable": boolean}], "tax": number, "tip": number, "discounts": number, "total": number|null}
Rules: price is the final line price after any per-item savings (quantity already multiplied). "category" is the store section heading the item is printed under (e.g. "Dairy", "Frozen Food"), or null if the receipt has no sections. "taxable" is true when the line is marked taxable (e.g. a "T" flag). Put order-level coupons into "discounts" as a positive number, not as items. "tip" includes tips, service or delivery fees. "tax" is all taxes combined. "total" is the printed grand total, or null. Use short readable item names (expand obvious abbreviations). Use 0 when a field is absent.`;

async function readReceipt(file){
  if (!sample) return;
  $("#pick").disabled = true;
  setStatus("Reading receipt… this can take up to a minute.");
  try {
    const r = await sample.json(PROMPT, {images:[file]});
    if (!r || !Array.isArray(r.items)) throw {code:"invalid_json"};
    state = {store: r.store || "Receipt",
      items: r.items.filter(i => i && i.name).map(i => ({name:String(i.name), price:num(i.price), tax:!!i.taxable, cat: i.category ? catTitle(String(i.category)) : undefined, who:[]})),
      tax:num(r.tax), tip:num(r.tip), disc:Math.abs(num(r.discounts)), printedTotal: r.total==null ? null : num(r.total)};
    setStatus(`Found ${state.items.length} items. Tag each one below.`);
    update();
  } catch(e) {
    const msg = {not_granted:"Claude access was declined, so the photo can't be read. You can still add items by hand.",
      rate_limited:"Too many requests right now. Try again in a minute.",
      image_rejected:"That image couldn't be read. Try a clearer JPEG or PNG under 20 MB.",
      invalid_json:"Couldn't make sense of that receipt. Try a sharper, flatter photo.",
      refused:"Claude couldn't read that image. Try a different photo."}[e && e.code] || "Something went wrong reading the receipt. Try again.";
    setStatus(msg, true);
  } finally { $("#pick").disabled = false; $("#file").value=""; }
}

$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => e.target.files[0] && readReceipt(e.target.files[0]);
const drop = $("#drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const f=e.dataTransfer.files[0]; if (f && f.type.startsWith("image/")) readReceipt(f); });
document.addEventListener("paste", e => { const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/")); if (f) readReceipt(f); });

update();
renderPeople();

(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch(e) { sample = null; }
  const lim = sample ? await sample.limits().catch(()=>null) : null;
  if (!lim?.images) { $("#pick").hidden = true; $(".drop .or").hidden = true; }
  $("#tidy").hidden = !sample || !state.items.some(i => /[A-Z]{3,}/.test(i.name));
})();
</script>
